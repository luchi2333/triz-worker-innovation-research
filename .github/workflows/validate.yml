name: Validate skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate skill package (strict)
        run: python triz-worker-innovation-research/scripts/validate_skill.py --strict
        shell: bash

      - name: Evaluation collection and reviewer regressions
        run: python -m unittest discover -s evals/worker-bench -p 'test_*.py'
        shell: bash

  render:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-noto-cjk
          python -m pip install PyMuPDF
      - name: Page limit, blank page and missing paragraph guards
        run: python triz-worker-innovation-research/scripts/test_render_smoke.py
      - name: Render three domains and both reader entries with bound review scaffolds
        run: python evals/worker-bench/run_report_smoke.py --output render-example --libreoffice libreoffice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-render-pages
          path: |
            render-example
