<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>技术方案图解</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f1f1f1;color:#333333;font:16px/1.7 "Microsoft YaHei","Noto Sans CJK SC",sans-serif}main{max-width:1200px;margin:30px auto;background:white;border-top:5px solid #535353;padding:32px 40px}h1{font-size:30px;line-height:1.5}h2{font-size:22px}button{font:inherit;cursor:pointer;background:white;border:1px solid #cacaca;color:#535353;padding:8px 14px}button[aria-pressed=true]{background:#535353;color:white}button:focus-visible{outline:3px solid #616161;outline-offset:3px}.intro,.limit{color:#696969;font-size:14px}nav,.steps{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:25px}.diagram{min-width:0;overflow:auto;border:1px solid #dfdfdf}.diagram svg{display:block;width:100%;height:auto;min-width:0}.diagram.is-zoomed svg{min-width:840px}.text{border-top:2px solid #333333;padding-top:14px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid #dadada;padding:10px}th{background:#f5f5f5}.parameters{overflow:auto;margin-top:28px}.print-only{display:none}footer{margin-top:28px;border-top:1px solid #cacaca;padding-top:12px;font-size:13px;color:#696969}@media(max-width:800px){main{margin:0;padding:20px 16px}.layout{grid-template-columns:minmax(0,1fr)}h1{font-size:25px}}@media print{body{background:white}main{margin:0;padding:0;border:0}nav,.steps,.interactive{display:none}.print-only{display:block}.print-only article{break-inside:avoid}.print-only svg{max-width:100%;height:auto}table{font-size:10pt}footer{font-size:9pt}}
table{border-top:1.5px solid #000;border-bottom:1.5px solid #000}th,td{border:0;background:#fff;color:#000}thead{border-bottom:1px solid #000}</style></head><body><main><p class="intro" id="status"></p><h1 id="title"></h1><p>按图理解结构与作用，按步骤理解工作过程。图中的编号、参数与报告共用研究记录。</p><nav id="figures" aria-label="选择工程图"></nav><div class="interactive"><h2 id="figure-title"></h2><div class="steps" id="steps" aria-label="选择动作"></div><p><button id="zoom" aria-pressed="false">放大图示</button> <span class="limit">放大后可左右移动查看细节。</span></p><div class="layout"><div class="diagram" id="diagram"></div><div class="text" aria-live="polite"><h2 id="message"></h2><p id="description"></p><p class="limit" id="limit"></p></div></div></div><div id="print" class="print-only"></div><div class="parameters"><h2>共享参数与证据</h2><table><thead><tr><th>参数</th><th>值</th><th>单位</th><th>依据</th></tr></thead><tbody id="parameters"></tbody></table></div><footer>F 现场报告 · M 受控实测 · S 外部来源 · H 工程假设。几何和文件检查不代表工程验证或制造放行。</footer></main>
<script id="research-data" type="application/json">__TRIZ_DATA__</script>
<script>
'use strict';const data=JSON.parse(document.getElementById('research-data').textContent);const el=id=>document.getElementById(id);let figureIndex=0,frameIndex=-1;
function text(id,value){el(id).textContent=value??''}document.title=data.title;text('title',data.title);text('status','技术方案图解 · '+data.maturity);
function button(label,selected,action){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',String(selected));b.addEventListener('click',action);return b}
el('zoom').addEventListener('click',()=>{const zoomed=el('diagram').classList.toggle('is-zoomed');el('zoom').setAttribute('aria-pressed',String(zoomed));el('zoom').textContent=zoomed?'适应宽度':'放大图示'});
function render(){const fig=data.figures[figureIndex];el('figures').replaceChildren(...data.figures.map((f,i)=>button(f.title,i===figureIndex,()=>{figureIndex=i;frameIndex=-1;render()})));text('figure-title',fig.title);text('message',fig.message);text('limit',fig.limit);const frames=fig.frames;el('steps').replaceChildren(...[button('完整图组',frameIndex===-1,()=>{frameIndex=-1;render()}),...frames.map((f,i)=>button(f.label,i===frameIndex,()=>{frameIndex=i;render()}))]);el('steps').hidden=frames.length===0;el('diagram').innerHTML=frameIndex<0?fig.svg:frames[frameIndex].svg;text('description',frameIndex<0?(frames.length?'选择动作查看对应图示与说明。':'结合部件编号和共享参数阅读；图示范围见下方证据边界。'):frames[frameIndex].description)}
for(const p of data.parameters){const row=document.createElement('tr');for(const v of [p.name||p.id,p.value??'待确定',p.unit,p.evidence_status]){const c=document.createElement('td');c.textContent=v;row.append(c)}el('parameters').append(row)}
for(const [i,f] of data.figures.entries()){const article=document.createElement('article');const h=document.createElement('h2');h.textContent=f.title;article.append(h);const image=document.createElement('div');image.innerHTML=f.svg.replaceAll(f.id+'-all-',f.id+'-print-');article.append(image);const p=document.createElement('p');p.textContent=f.message+' '+f.limit;article.append(p);for(const frame of f.frames){const d=document.createElement('p');d.textContent=frame.label+'：'+frame.description;article.append(d)}el('print').append(article)}render();
</script></body></html>
